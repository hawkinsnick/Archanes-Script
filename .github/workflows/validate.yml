name: validate
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pytest
      - name: Verify AI research bundle integrity
        run: python ai-skill/scripts/validate_bundle.py
      - run: pytest -q
      - name: Validate method-parity interfaces
        run: |
          python scripts/test_preexpert_parity.py
          python scripts/build_corpus_browser.py
          python scripts/research_api.py objects --limit 2 > /tmp/arc-api.json
          python scripts/export_research_layer.py /tmp/arc.json
